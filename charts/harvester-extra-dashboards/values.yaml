# Default values for harvester-extra-dashboards.

# -- Namespace holding the dashboard ConfigMaps. Must be the namespace Grafana's sidecar watches:
# `cattle-dashboards` for the Harvester rancher-monitoring add-on. The release itself can live elsewhere.
dashboardsNamespace: cattle-dashboards

sidecar:
  # -- Label (and value) the Grafana dashboard sidecar selects ConfigMaps on
  label: grafana_dashboard
  labelValue: "1"

psi:
  # -- Install the variant that also contains the pressure-stall (PSI) panels. Those panels only show data
  # when PSI is enabled in the node kernel (SUSE kernels boot with it off unless `psi=1`); per node, so a
  # panel only shows the nodes that were switched. node-exporter needs no change. See the README. Off by
  # default so that stock Harvester does not get always-empty panels.
  enabled: false

dashboards:
  contention:
    # -- "[SV+] Harvester VM Contention" (uid harvester-vm-contention-v1)
    enabled: true
  detail:
    # -- "[SV+] Harvester VM Info Detail v2" (uid harvester-vm-detail-v2)
    enabled: true
  rightsizing:
    # -- "[SV+] Harvester Right-Sizing" (uid harvester-rightsizing-v1): idle, over- and under-provisioned VMs
    enabled: true
  capacity:
    # -- "[SV+] Harvester Capacity & Reclaim" (uid harvester-capacity-v1): overcommit, N-1 headroom, stopped VMs,
    # Longhorn efficiency, unused volumes
    enabled: true
  scorecard:
    # -- "[SV+] Harvester VM Scorecard" (uid harvester-vm-scorecard-v1): one sortable row per VM with flags
    enabled: true

alerts:
  # -- Install a PrometheusRule with the contention, capacity and storage alerts. Off by default: it will start
  # firing in Alertmanager, whose routes decide who gets notified.
  enabled: false
  # -- Namespace of the PrometheusRule (default: the release namespace). The Harvester Prometheus selects rules
  # from every namespace.
  namespace: ""
  # -- Labels on the PrometheusRule; `release` is what a default kube-prometheus-stack ruleSelector expects
  labels:
    release: rancher-monitoring
  thresholds:
    cpuReadyWarn: 5
    cpuReadyCritical: 10
    guestMemoryPercent: 95
    launcherMemoryPercent: 95
    vmDiskLatencyMs: 50
    longhornLatencyMs: 50
    vmNetworkDropsPerSecond: 10
    # the three PSI alerts stay silent until the nodes boot with psi=1
    hostCpuPressurePercent: 30
    hostMemoryPressurePercent: 10
    hostIoPressurePercent: 40
    hostMemoryRequestsPercent: 90
    longhornScheduledWarn: 90
    longhornScheduledCritical: 100
    longhornNodeUsedPercent: 80
    diskAwaitMs: 50
    diskUtilPercent: 95

# -- Extra labels added to every dashboard ConfigMap
labels: {}
# -- Extra annotations added to every dashboard ConfigMap (for example the sidecar's folder annotation,
# if your Grafana sidecar is configured with `folderAnnotation`)
annotations: {}
