# Complete Alertmanager configuration for the Harvester rancher-monitoring add-on: the stock config plus one
# receiver that emails the "Harvester*" alerts of this repo, and the route that selects them.
# Stored in Secret alertmanager-rancher-monitoring-alertmanager (key alertmanager.yaml). See README.md.
global:
  resolve_timeout: 5m
inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
- target_matchers:
  - alertname = InfoInhibitor
receivers:
- name: "null"
- name: harvester-extra-email
  email_configs:
  - to: alerts@example.invalid              # <- CHANGE: where the mails go (the catcher accepts any address)
    from: alertmanager@harvester.lab        # <- CHANGE for a real relay
    smarthost: mailpit.cattle-monitoring-system.svc:1025
    require_tls: false                      # plain SMTP to the in-cluster catcher; remove for a real relay
    send_resolved: true
    # For a real relay, replace smarthost/require_tls and add credentials from a mounted Secret, never inline:
    #   smarthost: smtp.example.com:587
    #   auth_username: alertmanager@example.com
    #   auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
route:
  group_by:
  - namespace
  group_interval: 5m
  group_wait: 30s
  receiver: "null"
  repeat_interval: 12h
  routes:
  - matchers:
    - alertname = "Watchdog"
    receiver: "null"
  - matchers:                               # alerts from the harvester-extra-dashboards chart only
    - alertname =~ "Harvester.*"
    receiver: harvester-extra-email
    group_by: [alertname, namespace]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
templates:
- /etc/alertmanager/config/*.tmpl
