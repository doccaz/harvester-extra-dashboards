# Throwaway in-cluster mail catcher to prove the Alertmanager route and receiver work, before any real SMTP
# relay is involved. Nothing is delivered outside the cluster: Mailpit accepts messages on port 1025 and shows
# it in a web UI on 8025, but only from a client that logs in with the credential in Secret mailpit-smtp
# (create it first, see README.md). Messages are kept on a 1 GiB volume. The web UI is published by the Ingress at the end of this file and is
# protected by its own login (Secret mailpit-ui: create it first, see README.md). Mailpit cannot be served through the
# Kubernetes API service proxy (it needs its webroot in the request path, the proxy strips it). Delete it when done:  kubectl delete -f mailpit.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: harvester-extra-dashboards
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi        # default storage class (harvester-2replicas on this lab)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: harvester-extra-dashboards
spec:
  replicas: 1
  strategy:
    type: Recreate          # the volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: harvester-extra-dashboards
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.31.4
          env:
            - name: MP_SMTP_AUTH                  # "user:password", read from the Secret mailpit-smtp
              valueFrom:
                secretKeyRef:
                  name: mailpit-smtp
                  key: smtp-auth
            - name: MP_SMTP_AUTH_ALLOW_INSECURE   # plain SMTP inside the cluster
              value: "1"
            - name: MP_UI_AUTH                    # web UI + API login, "user:password" from the Secret mailpit-ui
              valueFrom:
                secretKeyRef:
                  name: mailpit-ui
                  key: ui-auth
            - name: MP_DATABASE
              value: /data/mailpit.db
            - name: MP_MAX_MESSAGES
              value: "500"
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailpit-data
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit              # SMTP only: Alertmanager sends here
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: harvester-extra-dashboards
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-web          # web UI only (a single port, so the API proxy path needs no ':port')
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: harvester-extra-dashboards
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - {name: http, port: 8025, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: harvester-extra-dashboards
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"    # Mailpit pushes new mail over a websocket
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: mailpit.conteudoquestionavel.org                 # <- CHANGE to your hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit-web
                port:
                  number: 8025
  tls:
    - hosts:
        - mailpit.conteudoquestionavel.org                   # <- same hostname; no secretName: the controller's default certificate, like auth/kasten
